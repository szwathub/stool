name: Master release gate
on:
  workflow_run:
    workflows: [Check]
    branches: [master]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  group: master-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grant tag eligibility only to a checked master release merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/git-flow.py master-gate
