name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  style:
    name: Style
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out release tag
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-style-${{ matrix.os }}
      - name: Install wget for Windows
        if: runner.os == 'Windows'
        run: choco install wget --no-progress
      - name: Check spelling
        uses: crate-ci/typos@v1.28.4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        if: success() || failure()
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    needs: style
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.style.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl build tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package release
        id: package
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stool
          target: ${{ matrix.target }}
          archive: stool-$tag-$target
          ref: refs/tags/${{ env.RELEASE_TAG }}
          leading-dir: true
          include: README.md,RELEASE_NOTES.md,LICENSE,completions${{ runner.os != 'Windows' && ',man-page' || '' }}
          locked: true
          build-tool: cargo
          tar: unix
          zip: windows
          dry-run: true
          dry-run-intended: true
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: stool-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tar }}
            ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [style, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.style.outputs.commit }}
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: stool-*
          path: artifacts
          merge-multiple: true
      - name: Verify archives and create checksums
        run: |
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 6
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            suffix=tar.gz
            case "$target" in *-windows-*) suffix=zip ;; esac
            test -s "artifacts/stool-$RELEASE_TAG-$target.$suffix"
          done
          cd artifacts
          sha256sum *.tar.gz *.zip | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Generate release notes
        id: notes
        uses: release-drafter/release-drafter@v7
        with:
          config-name: file:release-drafter.yml
          tag: ${{ env.RELEASE_TAG }}
          commitish: ${{ needs.style.outputs.commit }}
          filter-by-range: '<${{ env.RELEASE_TAG }}'
          dry-run: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
