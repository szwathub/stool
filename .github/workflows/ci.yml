name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  policy:
    name: Git-flow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release provenance and branch policy
        run: python -m unittest discover -s tests/python -p 'test_git_flow.py' -v
      - name: Validate Git-flow PR direction and release version
        run: python scripts/git-flow.py check-event
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the Unix installer
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests/python -p 'test_installer.py' -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Install GnuPG for disposable-key integration tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              if ! command -v gpg >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y gnupg
              fi
              ;;
            macOS)
              # Refresh preinstalled GnuPG as well, so image snapshots do not
              # pin native-key tests to an import bug fixed by Homebrew.
              brew update
              if brew list --versions gnupg >/dev/null 2>&1; then
                brew upgrade gnupg
              else
                brew install gnupg
              fi
              ;;
          esac
      - name: Test native offline GPG and SSH backups with disposable keys
        if: runner.os != 'Windows'
        env:
          STOOL_BIN: target/debug/stool
        run: python -m unittest discover -s tests/python -p 'test_secrets_native.py' -v
      - name: Check generated CLI assets
        if: runner.os == 'macOS'
        run: |
          sh scripts/generate-cli-assets.sh
          git diff --exit-code -- completions man-page
          if [ -n "$(git status --porcelain --untracked-files=all -- completions man-page)" ]; then
            git status --short --untracked-files=all -- completions man-page
            exit 1
          fi
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.74.0'
      - run: cargo test --locked --all-targets
