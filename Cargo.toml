[package]
name = "stool"
version = "0.7.1"
edition = "2021"
authors = ["Zhiwei Sun <szwathub@gmail.com>"]
license = "MIT"
repository = "https://github.com/szwathub/stool"
build = "build.rs"

[[bin]]
name = "stool"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "=0.21.7"
termcolor = "1.4.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
tempfile = "=3.10.1"
globset = "=0.4.15"
similar = "2.7"
fs2 = "0.4"
minijinja = { version = "=2.12.0", features = ["loader", "json", "custom_syntax"] }
encoding_rs = "0.8"
serde_yaml = "0.9"
age = { version = "=0.10.1", features = ["armor"] }
rpassword = "=7.3.1"
redb = "=2.1.4"
tar = "0.4"
flate2 = "1.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"] }
shell-words = "1.1"
semver = "1.0"
clap_complete = "4.4"
clap_mangen = "0.2"
gix = { version = "=0.63.0", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "revision", "status", "worktree-stream"] }
ratatui = { version = "=0.26.3", default-features = false, features = ["crossterm"] }
crossterm = "0.27"

[build-dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.4"
clap_mangen = "0.2"

[target.'cfg(windows)'.dependencies]
dunce = "=1.0.5"
windows-sys = { version = "=0.48.0", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[package.metadata.deb]
section = "utils"
assets = [
  ["target/release/stool", "usr/bin/", "755"],
  ["LICENSE", "usr/share/doc/stool/", "644"],
  ["README.md", "usr/share/doc/stool/README", "644"],
  ["man-page/*.1", "usr/share/man/man1/", "644"],
  ["completions/stool.bash", "usr/share/bash-completion/completions/stool", "644"],
]
